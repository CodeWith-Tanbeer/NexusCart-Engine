<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decoupled Fullstack System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="checkout-card">
    <h2>Secure E-Commerce Core</h2>
    
    <label for="userId">Account Identifier (User ID):</label>
    <input type="number" id="userId" value="101">

    <label for="productId">Catalog Target (Product ID):</label>
    <input type="number" id="productId" value="1">

    <label for="quantity">Order Volume (Quantity):</label>
    <input type="number" id="quantity" value="1">

    <button id="submitBtn">Execute System Transaction</button>
    <div id="statusOutput">Subsystem Interface Standby...</div>
</div>

<script src="script.js"></script>
</body>
</html>
